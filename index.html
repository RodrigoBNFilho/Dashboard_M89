<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard M89</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --navy: #1a2744;
  --navy-light: #243352;
  --green: #28a745;
  --green-bg: #e6f9ed;
  --red: #dc3545;
  --red-bg: #fce8ea;
  --blue: #2c7be5;
  --gray: #6c757d;
  --gray-light: #f4f5f7;
  --border: #dee2e6;
  --white: #ffffff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--gray-light); color: #333; font-size: 14px; }

.section-header {
  background: var(--navy); color: var(--white); padding: 14px 24px;
  font-size: 16px; font-weight: 700; letter-spacing: 0.5px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.section-header .period-toggle {
  margin-left: auto; display: flex; gap: 0;
  background: rgba(255,255,255,0.12); border-radius: 4px; overflow: hidden;
  border: 1px solid rgba(255,255,255,0.25);
}
.section-header .period-toggle button {
  padding: 4px 12px; font-size: 11px; cursor: pointer;
  border: none; background: transparent; color: rgba(255,255,255,0.75);
  font-weight: 600; letter-spacing: 0.4px; transition: all 0.15s;
  font-family: inherit; text-transform: uppercase;
}
.section-header .period-toggle button:hover { color: white; }
.section-header .period-toggle button.active { background: white; color: var(--navy); }
.section-header .period-toggle select {
  background: rgba(255,255,255,0.95); color: var(--navy);
  border: none; padding: 4px 8px; font-size: 11px; font-weight: 600;
  border-left: 1px solid rgba(0,0,0,0.1); cursor: pointer; font-family: inherit;
}
.badge-live {
  background: var(--green); color: white; font-size: 11px;
  padding: 2px 10px; border-radius: 12px; font-weight: 600;
}
.data-date {
  font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.7);
  text-transform: none; letter-spacing: 0;
}
.data-date strong { color: white; font-weight: 600; }
.container { max-width: 1440px; margin: 0 auto; padding: 0 16px; }

.top-bar {
  display: flex; gap: 0; background: var(--white);
  border: 1px solid var(--border); border-top: none;
  flex-wrap: wrap;
}
.top-bar .metric-box {
  padding: 14px 18px; border-right: 1px solid var(--border);
  min-width: 110px; flex: 1;
}
.top-bar .metric-box:last-child { border-right: none; }
.metric-label { font-size: 11px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.metric-value { font-size: 26px; font-weight: 700; }
.metric-sub { font-size: 11px; color: var(--gray); }
.metric-value.positive { color: var(--green); }
.metric-value.negative { color: var(--red); }
.changes-box {
  padding: 10px 16px; flex: 0 0 240px;
  display: flex; flex-direction: column; min-height: 0;
}
.changes-box .metric-label { margin-bottom: 4px; }
.trades-list {
  display: flex; flex-direction: column; gap: 3px;
  max-height: 44px; overflow-y: auto;
  padding-right: 4px;
}
.trades-list::-webkit-scrollbar { width: 6px; }
.trades-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
.change-tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px; border-radius: 4px;
  font-size: 12px; font-weight: 600;
}
.change-tag.added { background: var(--green-bg); color: var(--green); }
.change-tag.removed { background: var(--red-bg); color: var(--red); }
.change-tag .trade-vol {
  font-size: 11px; font-weight: 500; opacity: 0.8;
  font-variant-numeric: tabular-nums;
}

.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; background: var(--white); border: 1px solid var(--border); border-top: none; }
.card { padding: 24px; }
.card-left { border-right: 1px solid var(--border); }
.card-title {
  font-size: 13px; font-weight: 700; color: var(--navy);
  text-transform: uppercase; letter-spacing: 0.5px;
  padding-bottom: 12px; border-bottom: 2px solid var(--navy);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}

.pie-wrap-full { width: 100%; height: 320px; }

.composition-area {
  display: flex; gap: 20px; align-items: center;
}
.composition-area .pie-wrap { flex: 1 1 45%; height: 320px; min-width: 0; }
.composition-area .comp-table-wrap { flex: 1 1 55%; max-height: 320px; overflow-y: auto; }
.comp-table {
  width: 100%; border-collapse: collapse; font-size: 12px;
}
.comp-table th {
  background: var(--navy); color: white; padding: 6px 8px;
  text-align: left; font-weight: 600; font-size: 11px;
  position: sticky; top: 0;
}
.comp-table th.num { text-align: right; }
.comp-table td {
  padding: 5px 8px; border-bottom: 1px solid var(--gray-light);
}
.comp-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.comp-table tr:hover td { background: #f0f4ff; }
.comp-table .stock-link {
  color: var(--navy); text-decoration: none; font-weight: 600;
  border-bottom: 1px dashed rgba(26,39,68,0.35);
  transition: all 0.15s;
}
.comp-table .stock-link:hover {
  color: var(--blue); border-bottom-color: var(--blue);
}
.comp-table .stock-link .link-icon {
  font-size: 11px; opacity: 0.7; margin-left: 2px;
  display: inline-block; transition: transform 0.15s;
}
.comp-table .stock-link:hover .link-icon {
  opacity: 1; transform: translate(1px, -1px);
}
.comp-table .color-dot {
  display: inline-block; width: 10px; height: 10px; border-radius: 50%;
  margin-right: 6px; vertical-align: middle;
}
.comp-table tfoot td {
  font-weight: 700; background: #f0f4ff; border-top: 2px solid var(--navy);
}
.comp-table-note {
  font-size: 10px; color: var(--gray); text-align: right;
  margin-top: 6px; font-style: italic;
}

.card-title-right {
  margin-left: auto; font-size: 12px; font-weight: 600; color: var(--gray);
  text-transform: none; letter-spacing: 0;
}
.card-title-right strong { color: var(--navy); font-size: 14px; }

.toggle-group { margin-left: auto; display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
/* Quando o card tem toggle E card-title-right, toggle fica antes do PL sem consumir todo o espaco */
.card-title .toggle-group ~ .card-title-right { margin-left: 0; }
.toggle-btn {
  padding: 4px 14px; font-size: 12px; cursor: pointer;
  border: none; background: var(--white); color: var(--gray);
  font-weight: 600; transition: all 0.2s;
}
.toggle-btn.active { background: var(--navy); color: var(--white); }

.month-selector {
  display: flex; align-items: center; gap: 12px; padding: 16px 24px;
  background: var(--white); border: 1px solid var(--border); border-top: none;
}
.month-selector select {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 4px;
  font-size: 13px; background: white;
}
.month-selector label { font-size: 12px; font-weight: 700; color: var(--navy); }
.nav-btn {
  padding: 6px 16px; border: none; border-radius: 4px;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.nav-btn.prev { background: var(--blue); color: white; }
.nav-btn.next { background: var(--navy-light); color: white; }
.nav-btn:hover { opacity: 0.85; }

.perf-table-wrap { overflow-x: auto; background: var(--white); border: 1px solid var(--border); border-top: none; padding-bottom: 8px; }
table.perf-table {
  min-width: 1100px; width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap;
}
table.perf-table th {
  background: var(--navy); color: white; padding: 10px 12px;
  text-align: center; font-weight: 600; font-size: 12px;
  position: sticky; top: 0; z-index: 2;
}
table.perf-table th:first-child { text-align: left; position: sticky; left: 0; z-index: 3; }
table.perf-table td { padding: 8px 12px; text-align: center; border-bottom: 1px solid var(--gray-light); }
table.perf-table td:first-child {
  font-weight: 700; color: var(--navy); text-align: left;
  position: sticky; left: 0; background: var(--white); z-index: 1;
}
table.perf-table tr:hover td { background: #f0f4ff; }
table.perf-table tr:hover td:first-child { background: #f0f4ff; }
.val-pos { color: var(--green); font-weight: 500; }
.val-neg { color: var(--red); font-weight: 500; }
.bench-row td { color: #999 !important; font-weight: 400 !important; font-size: 12px; }
.bench-row td:first-child { color: #999 !important; font-style: italic; }
table.perf-table .col-sep { border-left: 2px solid var(--navy); }

.chart-wrap { background: var(--white); border: 1px solid var(--border); border-top: none; padding: 24px; }
.chart-container { position: relative; height: 420px; }

.section { margin-bottom: 32px; }
.spacer { height: 32px; }

.bar-chart-container { position: relative; height: 300px; }

.cum-controls {
  display: flex; align-items: flex-start; gap: 24px; margin-bottom: 20px; flex-wrap: wrap;
}
.cum-control-group { display: flex; align-items: center; gap: 10px; }
.cum-control-group label {
  font-size: 12px; font-weight: 700; color: var(--navy); white-space: nowrap;
}
.cum-control-group select {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 4px;
  font-size: 13px; background: white;
}
.cum-stock-checks { display: flex; flex-wrap: wrap; gap: 6px; }
.cum-show-old {
  font-size: 11px; padding: 4px 10px; border-radius: 4px;
  border: 1px dashed var(--gray); background: transparent; color: var(--gray);
  cursor: pointer; font-weight: 600; letter-spacing: 0.3px;
  transition: all 0.15s; font-family: inherit;
}
.cum-show-old:hover { color: var(--navy); border-color: var(--navy); }
.cum-stock-checks label {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px;
  font-size: 12px; font-weight: 600; color: var(--gray); cursor: pointer;
  transition: all 0.2s; background: var(--white);
}
.cum-stock-checks label:hover { border-color: var(--navy); color: var(--navy); }
.cum-stock-checks input:checked + span { color: var(--navy); }
.cum-stock-checks label:has(input:checked) { border-color: var(--navy); background: #eef2f7; }
.cum-stock-checks input { display: none; }

@media (max-width: 900px) {
  .card-grid { grid-template-columns: 1fr; }
  .card-left { border-right: none; border-bottom: 1px solid var(--border); }
  .composition-area { flex-direction: column; }
  .pie-wrap { width: 100%; }
}

/* ================== MOBILE (telefone) ================== */
@media (max-width: 720px) {
  .container { padding: 0 8px; }

  /* Header e branding */
  header { padding: 14px 8px; }
  header h1 { font-size: 18px; }
  header .subtitle { font-size: 12px; }

  /* Section header (CARTEIRA ATUAL / HISTORICO): periodo vai pra linha de baixo */
  .section-header {
    padding: 12px 14px; font-size: 14px; gap: 8px;
  }
  .section-header .period-toggle {
    margin-left: 0; flex: 1 1 100%; justify-content: stretch;
  }
  .section-header .period-toggle button {
    flex: 1; padding: 6px 8px; font-size: 11px; text-align: center;
  }
  .section-header .period-toggle select {
    flex: 1; min-width: 0;
  }
  .badge-live { font-size: 10px; padding: 2px 8px; }

  /* KPIs no topo: 2 colunas em vez de 3-4 */
  .top-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .top-bar .metric-box {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 10px 12px; min-width: 0;
  }
  .top-bar .metric-box:nth-child(2n) { border-right: none; }
  .metric-value { font-size: 20px; }
  .metric-label { font-size: 10px; }
  .metric-sub { font-size: 10px; }

  /* Card titles empilham toggles e info abaixo do titulo */
  .card { padding: 14px 12px; }
  .card-title {
    font-size: 12px; gap: 8px;
    align-items: flex-start;
  }
  .card-title .toggle-group { margin-left: 0; }
  .card-title-right { margin-left: 0; font-size: 11px; }
  .card-title-right strong { font-size: 13px; }
  .toggle-btn { padding: 4px 10px; font-size: 11px; }

  /* Mes selector: 2 linhas estaveis (selects em cima, navegacao embaixo) */
  .month-selector {
    padding: 10px 12px; gap: 8px;
    display: grid;
    grid-template-columns: auto 1fr auto 1fr;
    grid-template-areas:
      "ano-l ano-s mes-l mes-s"
      "prev prev next next";
    align-items: center;
  }
  .month-selector label:nth-of-type(1) { grid-area: ano-l; }
  .month-selector select#sel-year { grid-area: ano-s; }
  .month-selector label:nth-of-type(2) { grid-area: mes-l; }
  .month-selector select#sel-month { grid-area: mes-s; }
  .month-selector .nav-btn.prev { grid-area: prev; }
  .month-selector .nav-btn.next { grid-area: next; }
  .month-selector select { font-size: 12px; padding: 4px 8px; width: 100%; min-width: 0; }
  .nav-btn { padding: 6px 10px; font-size: 12px; width: 100%; }

  /* Composicao - donut menor pra caber inteiro */
  .pie-wrap-full { height: 260px; }
  .composition-area .pie-wrap { height: 240px; }
  .composition-area .comp-table-wrap { max-height: none; }
  .comp-table { font-size: 11px; }
  .comp-table td, .comp-table th { padding: 4px 6px; }

  /* Charts - altura reduzida no mobile */
  .chart-wrap { padding: 12px; }
  .chart-container { height: 280px; }
  .bar-chart-container { height: 260px; }

  /* Tabela performance historica: 1a coluna sticky com bg solido + scroll lateral */
  .perf-table-wrap {
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
  }
  table.perf-table { font-size: 11px; min-width: 760px; }
  table.perf-table th { padding: 8px 6px; font-size: 10px; }
  table.perf-table td { padding: 6px 6px; }
  table.perf-table th:first-child,
  table.perf-table td:first-child {
    padding-left: 8px; padding-right: 8px;
    box-shadow: 1px 0 0 var(--border);
  }

  /* Comparar ativos: label vira linha propria, chips ocupam largura total */
  .cum-controls { gap: 12px; }
  .cum-control-group {
    width: 100%; flex-wrap: wrap; align-items: flex-start;
  }
  .cum-control-group > label { flex: 0 0 100%; margin-bottom: 4px; }
  .cum-control-group > select { flex: 1; min-width: 0; }
  .cum-stock-checks {
    flex: 1 1 100%; gap: 5px; justify-content: flex-start;
  }
  .cum-stock-checks label { padding: 4px 8px; font-size: 11px; }
  .cum-show-old { width: 100%; padding: 6px 10px; }

  /* Box de movimentacoes no mobile: ocupa as 2 colunas com lista em coluna */
  .changes-box {
    padding: 10px 12px;
    grid-column: 1 / -1;
    flex: none;
  }
  .changes-box .metric-label { margin-bottom: 6px; }
  .trades-list { max-height: 120px; }
  .change-tag { font-size: 11px; padding: 2px 6px; }
  .change-tag .trade-vol { font-size: 10px; }

  /* Comparar ativos: chips alinhados a esquerda e mais compactos */
  .cum-stock-checks { justify-content: flex-start; }
  .cum-stock-checks label { padding: 3px 8px; font-size: 11px; }

  /* Section spacing */
  .section { margin-bottom: 18px; }
  .spacer { height: 18px; }
}

/* ================== MOBILE PEQUENO ================== */
@media (max-width: 420px) {
  .top-bar { grid-template-columns: 1fr 1fr; }
  .metric-value { font-size: 18px; }
  table.perf-table { font-size: 10px; min-width: 680px; }
  .chart-container { height: 240px; }
  .bar-chart-container { height: 220px; }
}

/* === PASSWORD GATE === */
#pwd-gate {
  position: fixed; inset: 0; background: var(--navy);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; padding: 20px;
}
#pwd-gate .pwd-card {
  background: white; border-radius: 8px; padding: 40px 36px;
  width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  text-align: center;
}
#pwd-gate h1 { font-size: 22px; color: var(--navy); margin-bottom: 6px; letter-spacing: 1px; }
#pwd-gate .pwd-sub { font-size: 12px; color: var(--gray); margin-bottom: 28px; text-transform: uppercase; letter-spacing: 0.8px; }
#pwd-gate input[type="password"] {
  width: 100%; padding: 12px 14px; font-size: 15px; border: 1px solid var(--border);
  border-radius: 4px; box-sizing: border-box; margin-bottom: 14px;
  font-family: inherit; transition: border-color 0.15s;
}
#pwd-gate input[type="password"]:focus { outline: none; border-color: var(--navy); }
#pwd-gate button {
  width: 100%; padding: 12px; background: var(--navy); color: white;
  border: none; border-radius: 4px; font-size: 14px; font-weight: 600;
  cursor: pointer; letter-spacing: 0.5px; text-transform: uppercase;
  font-family: inherit; transition: background 0.15s;
}
#pwd-gate button:hover { background: var(--navy-light); }
#pwd-gate .pwd-error { color: var(--red); font-size: 12px; margin-top: 10px; min-height: 16px; }
body.pwd-locked .container { display: none !important; }
</style>
</head>
<body class="pwd-locked">

<!-- Tela de senha (removida via JS quando autenticado) -->
<div id="pwd-gate">
  <div class="pwd-card">
    <h1>M89 DASHBOARD</h1>
    <div class="pwd-sub">Acesso restrito</div>
    <form id="pwd-form" onsubmit="checkPwd(event)">
      <input type="password" id="pwd-input" placeholder="Senha" autofocus autocomplete="off">
      <button type="submit">Entrar</button>
      <div class="pwd-error" id="pwd-error"></div>
    </form>
  </div>
</div>

<script>
// Hash SHA-256 da senha (gerado no Python). Senha em texto fica fora do HTML.
const __PWD_HASH = "1ada3c4d6951e34f7f8e569b4a449117ba98344443a7810ec036809264e82110";
const __PWD_KEY = "m89_dashboard_auth_v1";

async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPwd(e) {
  if (e) e.preventDefault();
  const input = document.getElementById('pwd-input').value;
  const errEl = document.getElementById('pwd-error');
  errEl.textContent = '';
  const h = await sha256(input);
  if (h === __PWD_HASH) {
    try { localStorage.setItem(__PWD_KEY, h); } catch(_) {}
    unlockDashboard();
  } else {
    errEl.textContent = 'Senha incorreta';
    document.getElementById('pwd-input').value = '';
  }
}

function unlockDashboard() {
  document.body.classList.remove('pwd-locked');
  const gate = document.getElementById('pwd-gate');
  if (gate) gate.remove();
}

// Auto-unlock se ja autenticado anteriormente neste browser
(function autoCheck() {
  if (!__PWD_HASH) { unlockDashboard(); return; }  // sem senha config
  try {
    const saved = localStorage.getItem(__PWD_KEY);
    if (saved === __PWD_HASH) unlockDashboard();
  } catch(_) {}
})();
</script>

<div class="container">

<div class="spacer"></div>

<div class="section" id="current-section">
  <div class="section-header">
    CARTEIRA ATUAL &mdash; <span id="current-title"></span>
    <span class="badge-live">ATUAL</span>
    <span class="data-date" id="data-date-badge"></span>
    <div class="period-toggle">
      <button class="active" onclick="setPeriodMode('current','month')">M&Ecirc;S</button>
      <button onclick="setPeriodMode('current','quarter')">TRIMESTRE</button>
      <button onclick="setPeriodMode('current','ytd')">YTD</button>
    </div>
  </div>
  <div class="top-bar" id="current-topbar"></div>
  <div class="card-grid">
    <div class="card card-left">
      <div class="card-title">
        COMPOSI&Ccedil;&Atilde;O DA CARTEIRA
        <div class="toggle-group" id="comp-current-toggle">
          <button class="toggle-btn active" onclick="setCompMode('current','asset')">POR ATIVO</button>
          <button class="toggle-btn" onclick="setCompMode('current','sector')">POR SETOR</button>
        </div>
        <span class="card-title-right" id="current-pl-title"></span>
      </div>
      <div class="composition-area">
        <div class="pie-wrap"><canvas id="pie-current"></canvas></div>
        <div class="comp-table-wrap" id="comp-table-current"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">
        DADOS POR A&Ccedil;&Atilde;O
        <div class="toggle-group">
          <button class="toggle-btn active" onclick="setBarMode('current','performance')">PERFORMANCE</button>
          <button class="toggle-btn" onclick="setBarMode('current','attribution')">ATRIBUI&Ccedil;&Atilde;O</button>
        </div>
      </div>
      <div class="bar-chart-container"><canvas id="bar-current"></canvas></div>
    </div>
  </div>
</div>

<div class="section" id="hist-section">
  <div class="section-header">
    CARTEIRAS HIST&Oacute;RICAS
    <div class="period-toggle">
      <button class="active" onclick="setHistPeriodType('month')">M&Ecirc;S</button>
      <button onclick="setHistPeriodType('quarter')">TRIMESTRE</button>
    </div>
  </div>
  <div class="month-selector">
    <label>ANO</label>
    <select id="sel-year" onchange="updateHistSelectors()"></select>
    <label id="sel-period-label">M&Ecirc;S</label>
    <select id="sel-month" onchange="renderHistorical()"></select>
    <button class="nav-btn prev" onclick="navMonth(-1)">&larr; Anterior</button>
    <button class="nav-btn next" onclick="navMonth(1)">Pr&oacute;ximo &rarr;</button>

function fmtPct(v, decimals=2) {
  if (v == null) return '\u2014';
  return (v >= 0 ? '+' : '') + v.toFixed(decimals) + '%';
}
function pctClass(v) { return v >= 0 ? 'positive' : 'negative'; }

function fmtMoney(v) {
  if (v == null) return '\u2014';
  return 'R$ ' + Math.round(v).toLocaleString('pt-BR');
}
function fmtMoneyShort(v) {
  if (v == null) return '\u2014';
  const abs = Math.abs(v);
  if (abs >= 1e9) return 'R$ ' + (v/1e9).toFixed(2).replace('.',',') + ' Bi';
  if (abs >= 1e6) return 'R$ ' + (v/1e6).toFixed(2).replace('.',',') + ' Mi';
  if (abs >= 1e3) return 'R$ ' + (v/1e3).toFixed(0) + ' Mil';
  return 'R$ ' + v.toFixed(0);
}

function renderTopBar(containerId, mtdF, mtdB, ytdF, ytdB, added, removed, mtdLabel, ytdLabel, changeLabel, showRisk, trades) {
  const c = document.getElementById(containerId);
  let html = '';
  html += `<div class="metric-box">
    <div class="metric-label">CARTEIRA</div>
    <div class="metric-value ${pctClass(mtdF)}">${fmtPct(mtdF)}</div>
    <div class="metric-sub">${mtdLabel}</div>
  </div>`;
  html += `<div class="metric-box">
    <div class="metric-label">IBOVESPA</div>
    <div class="metric-value ${pctClass(mtdB)}">${fmtPct(mtdB)}</div>
    <div class="metric-sub">${mtdLabel}</div>
  </div>`;
  if (ytdF != null) {
    html += `<div class="metric-box">
      <div class="metric-label">CARTEIRA</div>
      <div class="metric-value ${pctClass(ytdF)}">${fmtPct(ytdF)}</div>
      <div class="metric-sub">${ytdLabel}</div>
    </div>`;
    html += `<div class="metric-box">
      <div class="metric-label">IBOVESPA</div>
      <div class="metric-value ${pctClass(ytdB)}">${fmtPct(ytdB)}</div>
      <div class="metric-sub">${ytdLabel}</div>
    </div>`;
  }
  if (showRisk && DATA.risk) {
    const r = DATA.risk;
    html += `<div class="metric-box">
      <div class="metric-label">SHARPE</div>
      <div class="metric-value" style="color:var(--navy)">${r.sharpe.toFixed(2)}</div>
      <div class="metric-sub">Retorno/Risco</div>
    </div>`;
    html += `<div class="metric-box">
      <div class="metric-label">PIOR DIA</div>
      <div class="metric-value negative">${r.mdd.toFixed(2)}%</div>
      <div class="metric-sub">${r.mdd_date || 'Maior queda diaria'}</div>
    </div>`;
    html += `<div class="metric-box">
      <div class="metric-label">BETA</div>
      <div class="metric-value" style="color:var(--navy)">${r.beta.toFixed(2)}</div>
      <div class="metric-sub">vs IBOVESPA</div>
    </div>`;
    html += `<div class="metric-box">
      <div class="metric-label">VOL. FUNDO</div>
      <div class="metric-value" style="color:var(--navy)">${r.vol.toFixed(1)}%</div>
      <div class="metric-sub">Anualizada</div>
    </div>`;
    html += `<div class="metric-box">
      <div class="metric-label">VOL. IBOVESPA</div>
      <div class="metric-value" style="color:var(--navy)">${r.vol_bench.toFixed(1)}%</div>
      <div class="metric-sub">Anualizada</div>
    </div>`;
  }
  if (trades && trades.length > 0) {
    html += `<div class="changes-box"><div class="metric-label">MOVIMENTAÇÕES</div>`;
    html += `<div class="trades-list">`;
    trades.forEach(t => {
      const cls = t.type === 'buy' ? 'added' : 'removed';
      const arrow = t.type === 'buy' ? '&#9650;' : '&#9660;';
      html += `<span class="change-tag ${cls}">${arrow} ${t.nome} <span class="trade-vol">${fmtMoneyShort(t.value)}</span></span>`;
    });
    html += `</div></div>`;
  } else if (added.length > 0 || removed.length > 0) {
    // Fallback: se nao tem trades detalhados (compatibilidade), mostra adicoes/saidas
    html += `<div class="changes-box"><div class="metric-label">MOVIMENTAÇÕES</div>`;
    added.forEach(t => { html += `<span class="change-tag added">&#9650; ${t}</span>`; });
    removed.forEach(t => { html += `<span class="change-tag removed">&#9660; ${t}</span>`; });
    html += `</div>`;
  }
  c.innerHTML = html;
}

// Agrega stocks por setor, retornando array [{nome, peso, financeiro}, ...]
function aggregateBySector(stocks) {
  const agg = {};
  for (const s of stocks) {
    if (!s.peso || s.peso <= 0) continue;
    const key = s.setor || 'Outros';
    if (!agg[key]) agg[key] = { nome: key, peso: 0, financeiro: 0 };
    agg[key].peso += s.peso;
    agg[key].financeiro += s.financeiro;
  }
  return Object.values(agg);
}

function renderPie(canvasId, stocks, caixaPeso, mode) {
  if (charts[canvasId]) charts[canvasId].destroy();
  mode = mode || 'asset';
  const base = (mode === 'sector') ? aggregateBySector(stocks) : stocks;
  const colorMap = (mode === 'sector') ? (DATA.sector_colors || {}) : (DATA.stock_colors || {});
  // Ordena fatias por peso decrescente (maior primeiro)
  const sorted = base.filter(s => s.peso > 0).slice().sort((a, b) => b.peso - a.peso);
  const labels = sorted.map(s => s.nome);
  const values = sorted.map(s => s.peso);
  if (caixaPeso > 0) { labels.push('Caixa'); values.push(caixaPeso); }
  const colors = labels.map(nm => colorMap[nm] || '#999');

  charts[canvasId] = new Chart(document.getElementById(canvasId), {
    type: 'doughnut',
    data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => ' ' + ctx.label + ': ' + ctx.parsed.toFixed(1) + '%',
          },
        },
      },
    },
  });
}

function renderCompTable(containerId, stocks, caixaVal, caixaPeso, pl, mode) {
  mode = mode || 'asset';
  const base = (mode === 'sector') ? aggregateBySector(stocks) : stocks;
  const colorByName = (mode === 'sector') ? (DATA.sector_colors || {}) : (DATA.stock_colors || {});
  // Ordena por peso decrescente (mesma ordem do donut)
  const rows = base.filter(s => s.peso > 0)
    .slice().sort((a, b) => b.peso - a.peso);

  // Helper: divide por 1000 e formata com separador de milhar
  const fmtK = (v) => (v / 1000).toLocaleString('pt-BR', {maximumFractionDigits: 0});

  // Map de links de detalhe (so existe no modo asset; setor nao tem)
  const links = (mode === 'asset' && DATA.stock_links) ? DATA.stock_links : {};

  let html = '<table class="comp-table">';
  html += '<tbody>';
  for (const s of rows) {
    const color = colorByName[s.nome] || '#ccc';
    const tk = s.ticker;
    const url = tk && links[tk] ? links[tk] : null;
    const nameCell = url
      ? `<a class="stock-link" href="${url}" target="_blank" rel="noopener" title="Ver relatório de ${s.nome}">${s.nome} <span class="link-icon">&#8599;</span></a>`
      : s.nome;

// === HELPERS DE PERIODO ===========================================
// Estado dos toggles de periodo
const periodMode = { current: 'month' };  // 'month' | 'quarter' | 'ytd'
const histPeriod = { type: 'month' };     // 'month' | 'quarter'

// Retorna lista de keys (YYYY-MM) que pertencem ao periodo
function getPeriodKeys(refKey, mode) {
  const allKeys = DATA.month_labels.map(m => m.key).filter(k => DATA.portfolios[k]);
  if (mode === 'month') return [refKey];
  const [y, m] = refKey.split('-').map(Number);
  if (mode === 'quarter') {
    const qStart = Math.floor((m - 1) / 3) * 3 + 1;
    const result = [];
    for (let mm = qStart; mm <= qStart + 2; mm++) {
      const k = `${y}-${String(mm).padStart(2,'0')}`;
      if (allKeys.includes(k)) result.push(k);
    }
    return result;
  }
  if (mode === 'ytd') {
    return allKeys.filter(k => k.startsWith(`${y}-`) && k <= refKey);
  }
  return [refKey];
}

// Label do periodo (ex: "Marco 2026", "1T26", "YTD 2026")
function getPeriodLabel(refKey, mode) {
  const monthNames = ['','Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const [y, m] = refKey.split('-').map(Number);
  if (mode === 'month') return monthNames[m] + ' ' + y;
  if (mode === 'quarter') {
    const q = Math.floor((m - 1) / 3) + 1;
    return q + 'T' + String(y).slice(-2);
  }
  if (mode === 'ytd') return 'YTD ' + y;
  return monthNames[m] + ' ' + y;
}

// Agrega retornos do periodo: compoe fundo e benchmark, soma atribuicoes
function aggregatePeriod(monthKeys) {
  if (!monthKeys || monthKeys.length === 0) {
    return { fundRet: null, benchRet: null, stocksAgg: [], caixaAttr: 0, refKey: null };
  }
  const refKey = monthKeys[monthKeys.length - 1];
  const portfolios = monthKeys.map(k => DATA.portfolios[k]).filter(p => p);

  // Compoe retorno do fundo e do benchmark com PRECISAO ALTA (usa _raw se disponivel)
  let fundProd = 1, benchProd = 1;
  let fundOk = false, benchOk = false;
  for (const p of portfolios) {
    // Fund: usa fund_ret_raw (decimal) se disponivel, senao fund_ret (em %)
    if (p.fund_ret_raw != null) {
      fundProd *= (1 + p.fund_ret_raw);
      fundOk = true;
    } else if (p.fund_ret != null) {
      fundProd *= (1 + p.fund_ret/100);
      fundOk = true;
    }
    // Bench: prefere bench_ret_raw; fallback pro perf_table arredondado
    if (p.bench_ret_raw != null) {
      benchProd *= (1 + p.bench_ret_raw);
      benchOk = true;
    }
  }
  // Fallback: se nao tinha bench_ret_raw, le do perf_table (precisao 1 casa)
  if (!benchOk) {
    for (const k of monthKeys) {
      const [y, m] = k.split('-').map(Number);
      const pt = DATA.perf_table[String(y)];
      if (pt && pt.months[m] && pt.months[m].bench != null) {
        benchProd *= (1 + pt.months[m].bench/100);
        benchOk = true;
      }
    }
  }
  const fundRet = fundOk ? (fundProd - 1) * 100 : null;
  const benchRet = benchOk ? (benchProd - 1) * 100 : null;

  // Por acao: compoe ret_month e soma attribution
  const stocksMap = {};  // ticker -> {nome, setor, retProd, attrSum, peso, financeiro, hadRet}
  let caixaAttr = 0;
  for (const p of portfolios) {
    caixaAttr += (p.caixa_attribution || 0);
    for (const s of p.stocks) {
      const tk = s.ticker;
      if (!stocksMap[tk]) {
        stocksMap[tk] = {
          ticker: tk, nome: s.nome, setor: s.setor,
          retProd: 1, attrSum: 0, hadRet: false,
          peso: s.peso, financeiro: s.financeiro,
        };
      }
      if (s.ret_month != null) {
        stocksMap[tk].retProd *= (1 + s.ret_month/100);
        stocksMap[tk].hadRet = true;
      }
      if (s.attribution != null) stocksMap[tk].attrSum += s.attribution;
      // Pega peso/financeiro do ULTIMO mes do periodo
      stocksMap[tk].peso = s.peso;
      stocksMap[tk].financeiro = s.financeiro;
    }
  }
  const stocksAgg = Object.values(stocksMap).map(s => ({
    ticker: s.ticker, nome: s.nome, setor: s.setor,
    peso: s.peso, financeiro: s.financeiro,
    ret_month: s.hadRet ? (s.retProd - 1) * 100 : null,
    attribution: s.attrSum,
  }));

  // Movimentacoes do periodo: agrega trades (compras/vendas) por ticker+tipo
  const tradesAgg = {};  // chave = ticker + '|' + type
  for (const p of portfolios) {
    if (!p.trades) continue;
    for (const t of p.trades) {
      const k = t.ticker + '|' + t.type;
      if (!tradesAgg[k]) {
        tradesAgg[k] = { ticker: t.ticker, nome: t.nome, type: t.type, value: 0 };
      }
      tradesAgg[k].value += t.value;
    }
  }
  const trades = Object.values(tradesAgg)
    .sort((a, b) => b.value - a.value)
    .sort((a, b) => (a.type === 'buy' ? -1 : 1) - (b.type === 'buy' ? -1 : 1));

  return { fundRet, benchRet, stocksAgg, caixaAttr, refKey, trades };
}

// === RENDER BAR ===================================================
function renderBar(canvasId, stocks, mode, periodAgg) {
  if (charts[canvasId]) charts[canvasId].destroy();

  // periodAgg tem .fundRet e .benchRet do periodo (em %)
  // Se nao for passado, usa mes corrente do canvasId (compatibilidade)
  if (mode === 'attribution') {
    let totalVal, caixaAttr;
    if (periodAgg) {
      totalVal = periodAgg.fundRet;
      caixaAttr = periodAgg.caixaAttr || 0;
    } else {
      const key = canvasId === 'bar-current' ? DATA.latest_month : getSelectedKey();
      const portfolio = DATA.portfolios[key];
      if (!portfolio || portfolio.fund_ret == null) return;
      totalVal = portfolio.fund_ret;
      caixaAttr = portfolio.caixa_attribution || 0;
    }

    const filtered = stocks.filter(s => s.attribution != null && s.attribution !== 0)
                           .sort((a, b) => b.attribution - a.attribution);
    const labels = filtered.map(s => s.nome);
    const values = filtered.map(s => s.attribution);

    if (caixaAttr !== 0) {
      labels.push('Caixa');
      values.push(caixaAttr);
    }

    let cumulative = 0;
    const floatingData = [];
    const bgColors = [];
    values.forEach((v, i) => {
      const start = cumulative;
      cumulative += v;
      floatingData.push([Math.min(start, cumulative), Math.max(start, cumulative)]);
      if (labels[i] === 'Caixa') bgColors.push('rgba(44,123,229,0.85)');
      else bgColors.push(v >= 0 ? 'rgba(40,167,69,0.85)' : 'rgba(220,53,69,0.85)');
    });

    labels.push('TOTAL');
    floatingData.push(totalVal >= 0 ? [0, totalVal] : [totalVal, 0]);
    bgColors.push('rgba(26,39,68,0.9)');
    const _totalVal = totalVal;

    charts[canvasId] = new Chart(document.getElementById(canvasId), {
      type: 'bar',
      data: { labels, datasets: [{ data: floatingData, backgroundColor: bgColors, borderRadius: 3 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: {
            title: (items) => items[0]?.label || '',
            label: (ctx) => {
              const raw = ctx.raw;
              if (!Array.isArray(raw)) return fmtPct(raw);
              if (ctx.label === 'TOTAL') return ' Total: ' + fmtPct(_totalVal);
              const contribution = raw[1] - raw[0];
              return ' ' + fmtPct(contribution);
            }
          }},
        },
        scales: {
          y: { ticks: { callback: v => v.toFixed(1) + '%' }, grid: { color: '#eee' } },
          x: { grid: { display: false }, ticks: { font: { weight: '600', size: 12 } } },
        },
      },
    });
  } else {
    const filtered = stocks.filter(s => s.ret_month != null && s.peso > 0).sort((a, b) => b.ret_month - a.ret_month);
    const labels = filtered.map(s => s.nome);
    const values = filtered.map(s => s.ret_month);
    const bgColors = values.map(v => v >= 0 ? 'rgba(40,167,69,0.85)' : 'rgba(220,53,69,0.85)');

    // Linha pontilhada do Ibov (se disponivel)
    const ibovRet = periodAgg ? periodAgg.benchRet : null;
    const datasets = [{ type: 'bar', data: values, backgroundColor: bgColors, borderRadius: 3, label: 'A\u00e7\u00e3o', order: 2 }];
    if (ibovRet != null) {
      datasets.push({
        type: 'line',
        label: 'Ibov',
        data: labels.map(() => ibovRet),
        borderColor: '#e67e22',
        backgroundColor: '#e67e22',
        borderWidth: 2.5,
        borderDash: [8, 4],
        pointRadius: 0,
        pointHoverRadius: 5,
        fill: false,
        tension: 0,
        order: 1,
      });
    }

    charts[canvasId] = new Chart(document.getElementById(canvasId), {
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: ibovRet != null, position: 'top', align: 'end',
                    labels: {
                      usePointStyle: true,
                      pointStyle: 'rectRounded',
                      boxWidth: 10,
                      boxHeight: 10,
                      padding: 12,
                      font: { size: 11, weight: '600' },
                      generateLabels: (chart) => {
                        const items = Chart.defaults.plugins.legend.labels.generateLabels(chart);
                        return items.map(it => {
                          // Padroniza ambas as legendas com quadradinho colorido
                          it.fillStyle = it.strokeStyle;
                          it.lineWidth = 0;
                          it.pointStyle = 'rectRounded';
                          return it;
                        });
                      },
                    } },
          tooltip: { callbacks: { label: (ctx) => {
            if (ctx.dataset.type === 'line') return ' Ibov: ' + fmtPct(ctx.parsed.y);
            return ' ' + fmtPct(ctx.parsed.y);
          } } },
        },
        scales: {
          y: { ticks: { callback: v => v.toFixed(1) + '%' }, grid: { color: '#eee' } },
          x: { grid: { display: false }, ticks: { font: { weight: '600', size: 12 } } },
        },
      },
    });
  }
}

function renderCurrent() {
  const key = DATA.latest_month;
  const p = DATA.portfolios[key];
  document.getElementById('current-title').textContent = DATA.latest_label.toUpperCase();
  const dataDateBadge = document.getElementById('data-date-badge');

    dataDateBadge.innerHTML = 'Dados até <strong>' + DATA.latest_data_date + '</strong>';
  }

  // Periodo selecionado: month/quarter/ytd

  const periodKeys = getPeriodKeys(key, mode);
  const periodAgg = aggregatePeriod(periodKeys);
  const periodLabel = getPeriodLabel(key, mode);

  // KPIs Carteira/Ibov passam a refletir o periodo
  const fundVal = periodAgg.fundRet;
  const benchVal = periodAgg.benchRet;

  renderTopBar('current-topbar',

    DATA.ytd_fund, DATA.ytd_bench,

    true,

  renderBar('bar-current', periodAgg.stocksAgg, barModes.current, periodAgg);

function getSelectedKey() {
  const y = document.getElementById('sel-year').value;
  const m = document.getElementById('sel-month').value;
  return y + '-' + m;
}

function populateSelectors() {
  const years = [...new Set(DATA.month_labels.map(m => m.key.split('-')[0]))].sort();
  const selY = document.getElementById('sel-year');
  selY.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
  selY.value = years[years.length - 1];
  updateHistSelectors();
}

function updateHistSelectors() {
  const y = document.getElementById('sel-year').value;
  const selM = document.getElementById('sel-month');
  if (histPeriod.type === 'quarter') {
    // Lista trimestres do ano em que existem dados
    const months = DATA.month_labels.filter(m => m.key.startsWith(y) && DATA.portfolios[m.key]);
    const quartersAvail = [...new Set(months.map(m => Math.floor((parseInt(m.key.split('-')[1])-1)/3)+1))].sort();
    selM.innerHTML = quartersAvail.map(q => `<option value="Q${q}">${q}T${y.slice(-2)}</option>`).join('');
    if (quartersAvail.length > 0) selM.value = 'Q' + quartersAvail[quartersAvail.length - 1];
  } else {
    const months = DATA.month_labels.filter(m => m.key.startsWith(y));
    const monthNames = ['','Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    selM.innerHTML = months.map(m => {
      const mNum = parseInt(m.key.split('-')[1]);
      return `<option value="${m.key.split('-')[1]}">${monthNames[mNum]}</option>`;
    }).join('');
    if (months.length > 0) selM.value = months[months.length - 1].key.split('-')[1];
  }
  renderHistorical();
}

function navMonth(dir) {
  if (histPeriod.type === 'quarter') {
    // Navega entre trimestres
    const allKeys = DATA.month_labels.map(m => m.key).filter(k => DATA.portfolios[k]);
    const yearsQs = [...new Set(allKeys.map(k => {
      const [y, m] = k.split('-').map(Number);
      return y + '-Q' + (Math.floor((m-1)/3)+1);
    }))].sort();
    const cur = document.getElementById('sel-year').value + '-' + document.getElementById('sel-month').value;
    const idx = yearsQs.indexOf(cur);
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= yearsQs.length) return;
    const [yNew, qNew] = yearsQs[newIdx].split('-');
    document.getElementById('sel-year').value = yNew;
    updateHistSelectors();
    document.getElementById('sel-month').value = qNew;
    renderHistorical();
  } else {
    const keys = DATA.month_labels.map(m => m.key);
    const cur = getSelectedKey();
    const idx = keys.indexOf(cur);
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= keys.length) return;
    const parts = keys[newIdx].split('-');
    document.getElementById('sel-year').value = parts[0];
    updateHistSelectors();
    document.getElementById('sel-month').value = parts[1];
    renderHistorical();
  }
}

function renderHistorical() {
  const y = document.getElementById('sel-year').value;
  const sel = document.getElementById('sel-month').value;
  if (!y || !sel) return;

  let monthKeys = [];
  let label = '';
  let refKey = null;

  if (histPeriod.type === 'quarter') {
    const q = parseInt(sel.replace('Q', ''));
    const qStart = (q - 1) * 3 + 1;
    const allKeys = DATA.month_labels.map(m => m.key).filter(k => DATA.portfolios[k]);
    for (let mm = qStart; mm <= qStart + 2; mm++) {
      const k = `${y}-${String(mm).padStart(2,'0')}`;
      if (allKeys.includes(k)) monthKeys.push(k);
    }
    if (monthKeys.length === 0) return;
    refKey = monthKeys[monthKeys.length - 1];
    label = q + 'T' + String(y).slice(-2);
  } else {
    refKey = y + '-' + sel;
    if (!DATA.portfolios[refKey]) return;
    monthKeys = [refKey];
    const monthNames = ['','Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    label = monthNames[parseInt(sel)] + ' ' + y;
  }

  const p = DATA.portfolios[refKey];
  if (!p) return;
  const periodAgg = aggregatePeriod(monthKeys);

  document.getElementById('hist-port-title').textContent = 'CARTEIRA \u2014 ' + label.toUpperCase();

  renderTopBar('hist-topbar',
    periodAgg.fundRet, periodAgg.benchRet, null, null,
    p.added || [], p.removed || [],
    label, '', 'MOVIMENTA\u00c7\u00d5ES',
    false,
    periodAgg.trades || []
  );
  // Composicao = snapshot do FIM do periodo (refKey)
  renderPie('pie-hist', p.stocks, p.caixa_peso, compMode.hist);
  renderCompTable('comp-table-hist', p.stocks, p.caixa, p.caixa_peso, p.pl, compMode.hist);
  document.getElementById('hist-pl-title').innerHTML = 'PL: <strong>' + fmtMoneyShort(p.pl) + '</strong>';
  renderBar('bar-hist', periodAgg.stocksAgg, barModes.hist, periodAgg);
}

function renderPerfTable() {
  const months = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  let html = '<table class="perf-table"><thead><tr><th></th>';
  months.forEach(m => { html += `<th>${m}</th>`; });
  html += '<th class="col-sep">Ano</th><th>Acum.</th></tr></thead><tbody>';

  const years = Object.keys(DATA.perf_table).sort();
  let accumF = 1, accumB = 1;

  years.forEach(y => {
    const row = DATA.perf_table[y];
    // --- Linha do Fundo ---
    html += `<tr><td><strong>${y}</strong></td>`;
    for (let m = 1; m <= 12; m++) {
      if (row.months[m]) {
        const v = row.months[m].fund;
        const cls = v >= 0 ? 'val-pos' : 'val-neg';
        html += `<td class="${cls}">${fmtPct(v)}</td>`;
      } else {
        html += '<td></td>';
      }
    }
    const yf = row.year_ret_fund;
    const yb = row.year_ret_bench;
    accumF *= (1 + yf / 100);
    accumB *= (1 + yb / 100);
    const af = (accumF - 1) * 100;
    const ab = (accumB - 1) * 100;
    html += `<td class="col-sep ${yf >= 0 ? 'val-pos' : 'val-neg'}" style="font-weight:700">${fmtPct(yf)}</td>`;
    html += `<td class="${af >= 0 ? 'val-pos' : 'val-neg'}" style="font-weight:700">${fmtPct(af)}</td>`;
    html += '</tr>';

    // --- Linha do IBOV (cinza, discreta) ---
    html += `<tr class="bench-row"><td><em>Ibov.</em></td>`;
    for (let m = 1; m <= 12; m++) {
      if (row.months[m] && row.months[m].bench != null) {
        const v = row.months[m].bench;
        html += `<td>${fmtPct(v)}</td>`;
      } else {
        html += '<td></td>';
      }
    }
    html += `<td class="col-sep">${fmtPct(yb)}</td>`;
    html += `<td>${fmtPct(ab)}</td>`;
    html += '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById('perf-table-wrap').innerHTML = html;
}

}

function populateCumStockChecks() {
  const container = document.getElementById('cum-stock-checks');
  const sc = DATA.stock_cumulative;
  if (!sc) return;
  // Tickers temporarios/auxiliares que nao devem aparecer na selecao
  const EXCLUDE = new Set(['ITSA2', 'ITSA10', 'OIBR1']);
  // Separa em ATUAIS (na carteira de hoje) e ENCERRADOS (sairam)
  const latestStocks = DATA.portfolios[DATA.latest_month].stocks.map(s => s.ticker);
  const ativos = [];
  const encerrados = [];
  Object.keys(sc).forEach(t => {
    if (EXCLUDE.has(t)) return;
    if (latestStocks.includes(t)) ativos.push(t);
    else encerrados.push(t);
  });
  ativos.sort((a, b) => sc[a].nome.localeCompare(sc[b].nome));
  encerrados.sort((a, b) => sc[a].nome.localeCompare(sc[b].nome));

  let i = 0;
  const renderLabel = (t, encerrado) => {
    const color = STOCK_COLORS[i % STOCK_COLORS.length]; i++;
    const tag = encerrado ? ' <span style="opacity:0.55;font-size:9px">(encerrado)</span>' : '';
    const opacity = encerrado ? '0.7' : '1';
    return `<label style="border-color:${color}40;opacity:${opacity}"><input type="checkbox" value="${t}" onchange="renderCumulative()"><span style="color:${color}">${sc[t].nome}</span>${tag}</label>`;
  };

  let html = ativos.map(t => renderLabel(t, false)).join('');
  if (encerrados.length > 0) {
    // Toggle pra mostrar/ocultar encerrados
    html += `<button class="cum-show-old" onclick="toggleCumOldStocks(this)" type="button">+ Mostrar encerrados (${encerrados.length})</button>`;
    html += `<div id="cum-old-wrap" style="display:none;width:100%;margin-top:6px;">`;
    html += encerrados.map(t => renderLabel(t, true)).join('');
    html += `</div>`;
  }
  container.innerHTML = html;
}

function toggleCumOldStocks(btn) {
  const wrap = document.getElementById('cum-old-wrap');
  if (!wrap) return;
  if (wrap.style.display === 'none') {
    wrap.style.display = 'flex';
    wrap.style.flexWrap = 'wrap';
    wrap.style.gap = '6px';
    btn.textContent = btn.textContent.replace('+ Mostrar', '\u2212 Ocultar');
  } else {
    wrap.style.display = 'none';
    btn.textContent = btn.textContent.replace('\u2212 Ocultar', '+ Mostrar');
  }
}

function populateCumCustomRange() {
  const selFrom = document.getElementById('cum-from');
  const selTo = document.getElementById('cum-to');
  const opts = DATA.cumulative.map((d, i) => `<option value="${i}">${d.date}</option>`).join('');
  selFrom.innerHTML = opts;
  selTo.innerHTML = opts;
  // Padrao: do inicio ate o fim
  selFrom.value = 0;
  selTo.value = DATA.cumulative.length - 1;
}

function onCumRangeChange() {
  const rangeVal = document.getElementById('cum-range').value;
  const grp = document.getElementById('cum-custom-group');
  grp.style.display = (rangeVal === 'custom') ? '' : 'none';
  renderCumulative();
}

function renderCumulative() {
  if (charts['cum']) charts['cum'].destroy();

  const rangeVal = document.getElementById('cum-range').value;
  let cumData = DATA.cumulative.slice();

  // Filter by range
  let startIdx = 0;
  let endIdx = cumData.length - 1;
  if (rangeVal === 'ytd') {
    const lastDate = cumData[cumData.length - 1].date;
    const lastYear = lastDate.split('/')[1];
    startIdx = cumData.findIndex(d => d.date.includes('/' + lastYear));
    // Incluir o último ponto do ano anterior como base (Dez = ponto zero do YTD)
    if (startIdx > 0) startIdx -= 1;
    if (startIdx < 0) startIdx = 0;
  } else if (rangeVal === 'custom') {
    startIdx = parseInt(document.getElementById('cum-from').value) || 0;
    endIdx = parseInt(document.getElementById('cum-to').value);
    if (isNaN(endIdx)) endIdx = cumData.length - 1;
    // Garante start < end; se o usuario inverter, troca
    if (startIdx > endIdx) { const t = startIdx; startIdx = endIdx; endIdx = t; }
  } else if (rangeVal !== 'all') {
    const n = parseInt(rangeVal);
    startIdx = Math.max(0, cumData.length - n - 1);
  }
  cumData = cumData.slice(startIdx, endIdx + 1);

  // Rebase to 100 at start of range
  const baseF = cumData[0].fund;
  const baseB = cumData[0].bench;
  const labels = cumData.map(d => d.date);
  const fundData = cumData.map(d => d.fund / baseF * 100);
  const benchData = cumData.map(d => d.bench / baseB * 100);

  const datasets = [];
  const showM89 = document.getElementById('chk-m89')?.checked ?? true;
  const showIbov = document.getElementById('chk-ibov')?.checked ?? true;

  if (showM89) {
    datasets.push({
      label: 'M89',
      data: fundData,
      borderColor: '#1a2744',
      backgroundColor: 'rgba(26,39,68,0.08)',
      borderWidth: 2.5, fill: true, tension: 0.3,
      pointRadius: 4, pointBackgroundColor: '#1a2744',
    });
  }
  if (showIbov) {
    datasets.push({
      label: 'Ibovespa',
      data: benchData,
      borderColor: '#e67e22',
      borderWidth: 2, borderDash: [6, 3], fill: false, tension: 0.3,
      pointRadius: 3, pointBackgroundColor: '#e67e22',
    });
  }

  // Add selected stocks
  const checks = document.querySelectorAll('#cum-stock-checks input:checked');
  const sc = DATA.stock_cumulative;
  let colorIdx = 0;
  // Map all stock checkboxes to get consistent color index
  const allChecks = document.querySelectorAll('#cum-stock-checks input');
  const colorMap = {};
  allChecks.forEach((cb, i) => { colorMap[cb.value] = STOCK_COLORS[i % STOCK_COLORS.length]; });

  checks.forEach(cb => {
    const tk = cb.value;
    if (!sc || !sc[tk]) return;
    const info = sc[tk];
    const color = colorMap[tk] || '#999';

    // Align stock dates with cumulative labels
    const stockDataAligned = labels.map(lbl => {
      const idx = info.dates.indexOf(lbl);
      return idx >= 0 ? info.cum_stock[idx] : null;
    });

    // Rebase: alinha o PRIMEIRO valor nao-nulo do periodo selecionado em 100,
    // assim todas as series (M89, IBOV, acoes individuais) saem da mesma base
    // e ficam comparaveis entre si dentro do periodo escolhido.
    const firstValid = stockDataAligned.find(v => v != null);
    const rebasedStock = (firstValid != null && firstValid !== 0)
      ? stockDataAligned.map(v => v == null ? null : (v / firstValid) * 100)
      : stockDataAligned;

    datasets.push({
      label: info.nome,
      data: rebasedStock,
      borderColor: color,
      borderWidth: 2, fill: false, tension: 0.3,
      pointRadius: 3, pointBackgroundColor: color,
      spanGaps: false,  // Quebra a curva nos gaps (Opcao A: nao conecta atraves de periodo sem posicao)
    });
  });

  charts['cum'] = new Chart(document.getElementById('cum-chart'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { font: { size: 12, weight: '600' }, usePointStyle: true, padding: 12 } },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const val = ctx.parsed.y;
              if (val == null) return '';
              const ret = val - 100;
              return ctx.dataset.label + ': ' + val.toFixed(1) + ' (' + (ret >= 0 ? '+' : '') + ret.toFixed(1) + '%)';
            }
          }
        },
      },
      scales: {
        y: { grid: { color: '#eee' }, ticks: { callback: v => (v - 100).toFixed(0) + '%' } },
        x: { grid: { display: false } },
      },
    },
  });
}

document.addEventListener('DOMContentLoaded', () => {
  renderCurrent();
  populateSelectors();
  renderPerfTable();
  populateCumMainChecks();
  populateCumStockChecks();
  populateCumCustomRange();
  renderCumulative();
});
</script>
